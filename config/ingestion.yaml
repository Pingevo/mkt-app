# ============================================================
#  Ingestion Configuration
# รายการไฟล์ที่ระบบรองรับ + preprocessor ที่ใช้แปลงแต่ละประเภท
#  แก้ที่นี่อย่างเดียว ไม่ต้องแก้โค้ด
# ============================================================

# --- รูปแบบที่รองรับ ---
# ไฟล์ที่ไม่อยู่ในรายการนี้ → ระบบจะข้าม แจ้ง user ว่าไม่รองรับ ไม่ทำลาย
#
# หมายเหตุ: video/audio ต้องการ dependency เพิ่ม (ffmpeg, whisper)
# ถ้าติดตั้งแล้วเปิดในรายการด้านล่าง ถ้าไม่มี → ระบบจะบอก user ว่าไม่พร้อม
supported_formats:
  text:    [.txt, .md, .pdf, .xlsx, .xls, .docx, .csv]
  image:   [.jpg, .jpeg, .png, .webp]
  # video:   [.mp4, .mov]      # ต้องติดตั้ง ffmpeg ก่อนเปิด
  # audio:   [.wav, .mp3, .m4a]  # ต้องติดตั้ง whisper ก่อนเปิด

# --- Preprocessor ต่อประเภท ---
# แต่ละประเภทเรียก function ใน src/ingestion.py ชื่อตาม field นี้
preprocessors:
  text:    extract_text          # PyPDF2, openpyxl, python-docx, csv
  image:   extract_image_info    # เก็บ path รูปจริง (lossless) — agent เห็นรูปจริงตอนทำงาน
  # video:   extract_video_frames  # ffmpeg ดึง key frames → ส่งเข้า LLM
  # audio:   extract_audio_text    # whisper / API transcribe

# --- การตรวจ hash ---
# ถ้า raw file hash เหมือนเดิม → ข้าม re-ingest ประหยัด token
hash_check: true

# --- จำนวน video frames ที่ดึง ---
# ถ้ามากไป token แพง ถ้าน้อยไปอาจตกหล่นข้อมูล
video_max_frames: 5

# --- ขนาดไฟล์สูงสุด (MB) ---
# เกินขนาดนี้ → แจ้ง user ว่าไฟล์ใหญ่เกินไป
max_file_size_mb:
  text:    50
  image:   20
  # video:   200
  # audio:   100

# --- สถานะสินค้า ---
# 6 สถานะ: empty / pending / no_usable_data / processing / ready / stale
status_labels:
  empty:           "ว่าง"
  pending:         "รอ ingest"
  no_usable_data:  "ไม่มีข้อมูลใช้ได้"
  processing:      "กำลังประมวลผล"
  ready:           "พร้อม"
  stale:           "ข้อมูลเก่า"

# --- LLM params สำหรับ ingestion ---
# model ที่ใช้สร้าง description + summary จากข้อมูลดิบ
model: google/gemini-3.7-flash
temperature: 0.3
max_tokens_description: 1024      # max tokens สำหรับ description generation
max_tokens_summary: 512           # max tokens สำหรับ summary generation
timeout_seconds: 180              # timeout สำหรับ LLM ingestion (วินาที)
video_description_words: 200      # จำกัดคำใน description วิดีโอ
raw_text_length: 3000             # ความยาว raw_text ที่ส่งให้ LLM (ตัวอักษร)
summary_length: 200               # ความยาว summary ที่เก็บใน metadata (ตัวอักษร)
default_max_file_mb: 100          # ขนาดไฟล์สูงสุด default (MB)

# --- Product DB ---
raw_text_max_length: 12000        # ความยาว raw_text สูงสุดที่เก็บ (ตัวอักษร)

# --- Catalog Segmentation ---
# ตรวจและแยกหลายสินค้าจากไฟล์เดียว (เช่น price list 20 รุ่นใน 1 PDF)
# LLM ระบุเฉพาะชื่อ/รหัสและตำแหน่งในต้นฉบับ — ระบบคัด text เอง (ไม่รับสเปก/ราคาที่ LLM เขียนใหม่)
product_segmentation:
  enabled: true                    # เปิด/ปิด segmentation (ถ้าปิด → ใช้ single-product flow เดิม)
  model: google/gemini-3.7-flash   # model สำหรับ segmentation (override ของ ingestion หลัก)
  temperature: 0.2                 # ต่ำ → ผลคงที่ขึ้น
  max_output_tokens: 16384         # พอสำหรับ catalog 20+ รุ่น (แต่ละรุ่นมี source_refs)
  batch_size: 8000                 # จำนวนบรรทัดต่อ batch (เอกสารใหญ่แบ่งส่ง)
  batch_overlap: 500               # overlap ระหว่าง batch (บรรทัด) — กันสินค้าขาด
  pdf_max_bytes: 2000000           # ขนาด PDF สูงสุดที่ส่ง direct input (bytes)
  name_format: "{brand} {model}"   # รูปแบบชื่อสินค้าที่สร้างจาก segmentation
