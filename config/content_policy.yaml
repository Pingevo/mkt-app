content_history:
  max_entries: 200
  default_limit: 50
  caption_summary_length: 500
  caption_display_length: 150
  dedup_enabled: true
  dedup_model: openai/text-embedding-3-small
  dedup_similarity_threshold: 0.85
  dedup_window_days: 30
  dedup_max_retries: 3
  script_review_enabled: true         # self-review อัตโนมัติ (ไม่ต้อง approve user)
  script_review_threshold: 70         # score ≥ 70 = พอใช้, ต่ำกว่า = แก้แล้วตรวจใหม่
  script_review_max_iterations: 2     # max 2 รอบ (review + 1 re-check) — กัน loop ไม่รู้จบ
