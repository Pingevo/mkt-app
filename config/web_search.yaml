# ============================================================
# Web Search — การค้นหาเว็บ (operational)
# แยกจาก agents.yaml เพื่อ separation of concerns
# ============================================================

max_results: 5                    # จำนวนผลค้นหาสูงสุด
max_results_detailed: 3           # จำนวนผลค้นหาสำหรับ detailed search
max_queries: 5                    # จำนวน query สูงสุดใน planning phase
competitor_max_results: 5         # จำนวนผลค้นหา competitor

# LLM params สำหรับ web search planning + execution
planning_temperature: 0.2
planning_max_tokens: 512
execution_temperature: 0.1
execution_max_tokens: 1500
