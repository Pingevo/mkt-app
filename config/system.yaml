# ============================================================
# System-wide operational settings
# ค่า operational ที่เคย hardcode ในโค้ด — timeouts, ports, display lengths
# แยกจาก agents.yaml เพื่อ separation of concerns
# ============================================================

web_port: 8778                    # port ของ web viewer

# Timeouts (วินาที)
api_timeout_credits: 10           # เช็ค OpenRouter credits
api_timeout_ai_usage: 5           # AI Usage Hub
api_timeout_capabilities: 30      # ดึง model capabilities
api_timeout_video: 60             # video API
api_timeout_video_download: 120   # ดาวน์โหลดวิดีโอ
ffmpeg_timeout: 120               # FFmpeg

# Cache
cache_ttl_capabilities: 3600      # TTL cache model capabilities (วินาที)

# Streaming
stream_refresh_rate: 15           # refresh rate (fps)

# File processing
file_hash_chunk_size: 8192        # chunk size สำหรับ hash ไฟล์ (bytes)

# Display lengths (ตัวอักษร)
error_preview_length: 200         # error message preview
display_preview_length: 500       # preview สั้น
display_preview_long: 800         # preview ยาว
caption_display_length: 500       # caption สำหรับ display
filename_max_length: 30           # ชื่อไฟล์สูงสุด

# Scheduler — ระบบทำงานอัตโนมัติตามเวลาที่ตั้ง
scheduler:
  enabled: true                   # เปิด/ปิด scheduler ทั้งระบบ
  max_concurrent_jobs: 1          # จำกัดขนาน (ป้องกัน OpenRouter rate limit)
  misfire_grace_time: 1           # 1 = เกือบไม่ยิงชดเชย (เลย 1 วินาที = บันทึก "missed" ลงประวัติแทน — กดรันใหม่ได้)
                                  # (APScheduler ไม่ยอมรับ 0 — ระบบแปลง 0/ลบ เป็น 1 อัตโนมัติ)
  coalesce: true                  # ถ้าพลาดหลายครั้ง ยิงครั้งเดียวรวม
  job_store_path: "cache/scheduled_jobs.json"
  run_log_path: "cache/scheduled_runs.json"
  run_log_retention_days: 30      # ล้างประวัติเกิน 30 วัน (เทียบระดับวัน)
  max_run_log_entries: 200        # fallback จำกัดประวัติตามจำนวน
  job_timeout: 600                # timeout สำหรับยิง job ผ่าน HTTP (วินาที)
